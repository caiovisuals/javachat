# Docker das dependências de infraestrutura do desenvolvimento.
#   A API e o front-end rodam fora daqui, com hot reload:
#   back-end/  ./mvnw spring-boot:run
#   front-end/ npm start

services:
  db:
    image: postgres:16-alpine
    container_name: javachat-db
    environment:
      POSTGRES_DB: ${DB_NAME:-javachat}
      POSTGRES_USER: ${DB_USER:-javachat}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-javachat}
    ports:
      - '5432:5432'
    volumes:
      - javachat-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-javachat} -d ${DB_NAME:-javachat}']
      interval: 5s
      timeout: 3s
      retries: 10

  adminer:
    image: adminer:latest
    container_name: javachat-adminer
    ports:
      - '8081:8080'
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      db:
        condition: service_healthy

volumes:
  javachat-db: