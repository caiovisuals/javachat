spring:
  application:
    name: javachat
    version: '@project.version@'
  profiles:
    default: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/javachat}
    username: ${DB_USER:javachat}
    password: ${DB_PASSWORD:javachat}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

app:
  cors:
    allowed-origins: ${CORS_ORIGINS:}

  jwt:
    # Sem valor padrão: a aplicação recusa subir com segredo ausente ou curto demais.
    secret: ${JWT_SECRET:}
    access-token-ttl: 15m
    refresh-token-ttl: 7d
    issuer: javachat

  rate-limit:
    attempts: 10
    window: 5m

  auth:
    cookie-name: refreshToken
    secure-cookie: true
    # Strict impede que outro site provoque uma renovação de sessão a partir do navegador.
    cookie-same-site: Strict
    # O cookie só é enviado para os endpoints que precisam dele.
    cookie-path: /api/auth

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method