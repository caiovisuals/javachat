name: CI

on:
    push:
        branches: [main]
    pull_request:

# Uma execução por branch: um push novo cancela o anterior
concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
  back-end:
    name: Back-end (Java 21)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back-end
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Verify inclui os testes de integração com Testcontainers
      - name: Build e testes
        run: ./mvnw -B --no-transfer-progress verify

  front-end:
    name: Front-end (Angular 21)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front-end
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: front-end/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Formatação
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Testes
        run: npm test